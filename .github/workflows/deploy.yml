name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Configure contact form
        env:
          FORMSPREE_FORM_ID: ${{ secrets.FORMSPREE_FORM_ID }}
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          sed -i "s|__PAGES_URL__|${PAGES_URL}|g" index.html
          if [ -n "$FORMSPREE_FORM_ID" ]; then
            sed -i "s|FORMSPREE_FORM_ID|${FORMSPREE_FORM_ID}|g" index.html
          fi

      - name: Prune app sources from Pages artifact
        run: |
          # Keep static site content. A previous prune list included demos/
          # and 404'd every live demo on supportsidetech.com after deploy.
          # Never add demos, projects, assets, or HTML write-ups to this list.
          rm -rf node_modules studio homeschool-ai-scheduler
          test -d demos
          test -d projects
          test -f demos/summit-roofing/index.html
          test -f demos/the-parlor/index.html
          test -f demos/business-dashboard/index.html
          test -f projects/stanza.html
          test -f projects/homeschool-ai-scheduler.html
          test -f projects/lantern-hollow.html
          test -f projects/adirondack-property-group.html
          test -f assets/images/projects/homeschool-ai-scheduler-preview.png
          test -f assets/images/projects/stanza-preview.jpg
          test -f assets/images/projects/lantern-hollow-preview.jpg
          test -f assets/images/projects/summit-roofing-preview.png

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
